name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Select Client"
        required: true
        type: choice
        options:
          - client-a
          - client-b
          - client-c

      operation:
        description: "Terraform Operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

jobs:
  terraform:

    name: Terraform ${{ github.event.inputs.operation }} - ${{ github.event.inputs.client }}

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      ##########################################################
      # Checkout
      ##########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##########################################################
      # Terraform
      ##########################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Display Terraform Version
        run: terraform version

      ##########################################################
      # Azure Login
      ##########################################################

      - name: Azure Login using Service Principal
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      ##########################################################
      # Export ARM Variables
      ##########################################################

      - name: Export ARM Environment Variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_admin_password=${{ secrets.TF_VAR_ADMIN_PASSWORD }}" >> $GITHUB_ENV

      ##########################################################
      # Verify Azure Login
      ##########################################################

      - name: Confirm Azure Account
        run: az account show

      ##########################################################
      # Backend
      ##########################################################

      - name: Generate Backend Configuration
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.BACKEND_CONTAINER }}"
          key                  = "clients/${{ inputs.client }}/terraform.tfstate"
          EOF

      ##########################################################
      # TFVARS
      ##########################################################

      - name: Generate Client Variable File
        run: |
          cp environments/${{ github.event.inputs.client }}/${{ github.event.inputs.client }}.tfvars.example selected-client.tfvars

      ##########################################################
      # FIXED FORMAT ISSUE
      ##########################################################

      - name: Format Generated TFVars
        run: terraform fmt selected-client.tfvars

      ##########################################################
      # Check Placeholder Values
      ##########################################################

      - name: Check for Remaining Placeholders
        run: |
          if grep -Ei "your|placeholder|change_me" backend.hcl selected-client.tfvars; then
            echo "Placeholder values remain."
            exit 1
          fi

      ##########################################################
      # Terraform Format
      ##########################################################

      - name: Terraform Format Check
        run: |
          terraform fmt -recursive
          terraform fmt -check -recursive

      ##########################################################
      # Terraform Init
      ##########################################################

      - name: Terraform Initialize
        run: |
          terraform init \
            -backend-config=backend.hcl

      ##########################################################
      # Validate
      ##########################################################

      - name: Terraform Validate
        run: terraform validate

      ##########################################################
      # Plan
      ##########################################################

      - name: Terraform Plan
        if: github.event.inputs.operation == 'plan'
        run: |
          terraform plan \
            -var-file=selected-client.tfvars \
            -out=tfplan

      ##########################################################
      # Show Plan
      ##########################################################

      - name: Convert Plan to Readable Text
        if: github.event.inputs.operation == 'plan'
        run: terraform show tfplan

      ##########################################################
      # Upload Plan
      ##########################################################

      - name: Upload Terraform Plan
        if: github.event.inputs.operation == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.client }}
          path: tfplan

      ##########################################################
      # Apply
      ##########################################################

      - name: Terraform Apply
        if: github.event.inputs.operation == 'apply'
        run: |
          terraform apply \
            -auto-approve \
            -var-file=selected-client.tfvars

      ##########################################################
      # Destroy
      ##########################################################

      - name: Terraform Destroy
        if: github.event.inputs.operation == 'destroy'
        run: |
          terraform destroy \
            -auto-approve \
            -var-file=selected-client.tfvars