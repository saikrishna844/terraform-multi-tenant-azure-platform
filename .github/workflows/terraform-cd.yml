name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Select Client"
        required: true
        type: choice
        options:
          - client-a
          - client-b
          - client-c

      operation:
        description: "Terraform Operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

jobs:
  terraform:

    name: Terraform ${{ github.event.inputs.operation }} - ${{ github.event.inputs.client }}

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    #####################################################
    # Azure Login using Service Principal
    #####################################################

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: |
          {
            "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
          }

    #####################################################
    # Generate Backend Configuration
    #####################################################

    - name: Generate Backend Config
      run: |
        cp environments/${{ github.event.inputs.client }}/${{ github.event.inputs.client }}.backend.hcl.example backend.hcl

    #####################################################
    # Generate tfvars
    #####################################################

    - name: Generate Terraform Variables
      run: |
        cp environments/${{ github.event.inputs.client }}/${{ github.event.inputs.client }}.tfvars.example terraform.tfvars

    #####################################################
    # Terraform Init
    #####################################################

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config=backend.hcl

    #####################################################
    # Terraform Validate
    #####################################################

    - name: Terraform Validate
      run: terraform validate

    #####################################################
    # Terraform Format Check
    #####################################################

    - name: Terraform Format
      run: terraform fmt -check

    #####################################################
    # Terraform Plan
    #####################################################

    - name: Terraform Plan
      if: github.event.inputs.operation == 'plan'
      run: |
        terraform plan \
          -var-file=terraform.tfvars \
          -out=tfplan

    #####################################################
    # Terraform Apply
    #####################################################

    - name: Terraform Apply
      if: github.event.inputs.operation == 'apply'
      run: |
        terraform apply \
          -auto-approve \
          -var-file=terraform.tfvars

    #####################################################
    # Terraform Destroy
    #####################################################

    - name: Terraform Destroy
      if: github.event.inputs.operation == 'destroy'
      run: |
        terraform destroy \
          -auto-approve \
          -var-file=terraform.tfvars