name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Select client"
        required: true
        type: choice
        options:
          - client-a
          - client-b
          - client-c

      operation:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.client }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }} - ${{ inputs.client }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Confirm Azure context
        run: |
          az account show \
            --query "{subscription:name,subscriptionId:id,tenantId:tenantId}" \
            --output table

      - name: Generate backend configuration
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.BACKEND_CONTAINER }}"
          key                  = "clients/${{ inputs.client }}/terraform.tfstate"

          subscription_id = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          tenant_id       = "${{ secrets.AZURE_TENANT_ID }}"
          client_id       = "${{ secrets.AZURE_CLIENT_ID }}"
          client_secret   = "${{ secrets.AZURE_CLIENT_SECRET }}"
          EOF

      - name: Verify backend configuration
        run: |
          echo "Client: ${{ inputs.client }}"
          echo "Backend resource group: ${{ vars.BACKEND_RESOURCE_GROUP }}"
          echo "Backend storage account: ${{ vars.BACKEND_STORAGE_ACCOUNT }}"
          echo "Backend container: ${{ vars.BACKEND_CONTAINER }}"
          echo "Backend key: clients/${{ inputs.client }}/terraform.tfstate"

      - name: Generate client variable file
        run: |
          cp \
            "environments/${{ inputs.client }}/${{ inputs.client }}.tfvars.example" \
            "selected-client.tfvars"

          sed -i \
            's/YOUR_AZURE_TENANT_ID/${{ secrets.AZURE_TENANT_ID }}/g' \
            selected-client.tfvars

          sed -i \
            's/your-real-tenant-id/${{ secrets.AZURE_TENANT_ID }}/g' \
            selected-client.tfvars

          sed -i \
            's/your-tenant-id/${{ secrets.AZURE_TENANT_ID }}/g' \
            selected-client.tfvars

      - name: Check for remaining placeholders
        run: |
          if grep -Ei \
            'YOUR_|your tenant|your-tenant|your subscription|your backend|your storage' \
            backend.hcl selected-client.tfvars; then
            echo "Placeholder values remain in generated Terraform configuration."
            exit 1
          fi

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -reconfigure \
            -input=false \
            -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: inputs.operation == 'plan'
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=selected-client.tfvars \
            -out="${{ inputs.client }}.tfplan"

      - name: Show Terraform plan
        if: inputs.operation == 'plan'
        run: |
          terraform show \
            -no-color \
            "${{ inputs.client }}.tfplan" \
            > "${{ inputs.client }}-plan.txt"

      - name: Upload plan artifact
        if: inputs.operation == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client }}-terraform-plan
          path: |
            ${{ inputs.client }}.tfplan
            ${{ inputs.client }}-plan.txt
          retention-days: 5

      - name: Terraform apply
        if: inputs.operation == 'apply'
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var-file=selected-client.tfvars

      - name: Terraform destroy
        if: inputs.operation == 'destroy'
        run: |
          terraform destroy \
            -input=false \
            -auto-approve \
            -var-file=selected-client.tfvars