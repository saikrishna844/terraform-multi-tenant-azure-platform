name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client deployment will be enabled after Azure OIDC setup"
        required: true
        type: choice
        options:
          - client-a
          - client-b
          - client-c

jobs:
  oidc-not-configured:
    name: Deployment Setup Required
    runs-on: ubuntu-latest

    steps:
      - name: Display setup status
        run: |
          echo "Terraform CD is currently disabled."
          echo "Selected client: ${{ inputs.client }}"
          echo "Configure Azure OIDC, GitHub environments, backend variables,"
          echo "and VM password secrets before enabling apply."