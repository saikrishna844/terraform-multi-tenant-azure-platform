name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Select client"
        required: true
        type: choice
        options:
          - client-a
          - client-b
          - client-c

      operation:
        description: "Select Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.client }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }} - ${{ inputs.client }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Display Terraform version
        run: terraform version

      - name: Azure login using Service Principal
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Confirm Azure account
        run: |
          az account show \
            --query "{subscription:name,subscriptionId:id,tenantId:tenantId}" \
            --output table

      - name: Verify required GitHub variables
        run: |
          if [ -z "${{ vars.BACKEND_RESOURCE_GROUP }}" ]; then
            echo "BACKEND_RESOURCE_GROUP is missing."
            exit 1
          fi

          if [ -z "${{ vars.BACKEND_STORAGE_ACCOUNT }}" ]; then
            echo "BACKEND_STORAGE_ACCOUNT is missing."
            exit 1
          fi

          if [ -z "${{ vars.BACKEND_CONTAINER }}" ]; then
            echo "BACKEND_CONTAINER is missing."
            exit 1
          fi

          if [ -z "${{ vars.ALERT_EMAIL_ADDRESS }}" ]; then
            echo "ALERT_EMAIL_ADDRESS is missing."
            exit 1
          fi

      - name: Generate backend configuration
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.BACKEND_CONTAINER }}"
          key                  = "clients/${{ inputs.client }}/terraform.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Verify backend configuration
        run: |
          echo "Selected client         : ${{ inputs.client }}"
          echo "Backend resource group  : ${{ vars.BACKEND_RESOURCE_GROUP }}"
          echo "Backend storage account : ${{ vars.BACKEND_STORAGE_ACCOUNT }}"
          echo "Backend container       : ${{ vars.BACKEND_CONTAINER }}"
          echo "Backend state key       : clients/${{ inputs.client }}/terraform.tfstate"

      - name: Generate client variable file
        run: |
          SOURCE_FILE="environments/${{ inputs.client }}/${{ inputs.client }}.tfvars.example"

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "File not found: $SOURCE_FILE"
            exit 1
          fi

          cp "$SOURCE_FILE" selected-client.tfvars

          sed -i \
            -e 's|YOUR_AZURE_TENANT_ID|${{ secrets.AZURE_TENANT_ID }}|g' \
            -e 's|Your Tenant ID|${{ secrets.AZURE_TENANT_ID }}|g' \
            -e 's|your tenant id|${{ secrets.AZURE_TENANT_ID }}|g' \
            -e 's|your-tenant-id|${{ secrets.AZURE_TENANT_ID }}|g' \
            -e 's|your-real-tenant-id|${{ secrets.AZURE_TENANT_ID }}|g' \
            -e 's|YOUR_ALERT_EMAIL_ADDRESS|${{ vars.ALERT_EMAIL_ADDRESS }}|g' \
            -e 's|Your Email Address|${{ vars.ALERT_EMAIL_ADDRESS }}|g' \
            -e 's|your Email address|${{ vars.ALERT_EMAIL_ADDRESS }}|g' \
            -e 's|your email address|${{ vars.ALERT_EMAIL_ADDRESS }}|g' \
            selected-client.tfvars

      - name: Format generated client variables
        run: terraform fmt selected-client.tfvars

      - name: Check generated files for placeholders
        run: |
          if grep -Ein \
            'YOUR_AZURE_TENANT_ID|Your Tenant ID|your tenant id|your-tenant-id|your-real-tenant-id|YOUR_ALERT_EMAIL_ADDRESS|Your Email Address|your Email address|your email address|Your Azure Subscription ID|Your backend resource group|Your Storage Account' \
            backend.hcl selected-client.tfvars; then

            echo "Placeholder values remain in generated files."
            exit 1
          fi

          echo "No placeholder values remain."

      - name: Terraform format check
        run: |
          terraform fmt -check -recursive

      - name: Terraform initialize
        run: |
          terraform init \
            -reconfigure \
            -input=false \
            -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: inputs.operation == 'plan'
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=selected-client.tfvars \
            -out="${{ inputs.client }}.tfplan"

      - name: Convert plan to readable text
        if: inputs.operation == 'plan'
        run: |
          terraform show \
            -no-color \
            "${{ inputs.client }}.tfplan" \
            > "${{ inputs.client }}-plan.txt"

      - name: Upload Terraform plan
        if: inputs.operation == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client }}-terraform-plan
          path: |
            ${{ inputs.client }}.tfplan
            ${{ inputs.client }}-plan.txt
          retention-days: 5
          if-no-files-found: error

      - name: Create apply plan
        if: inputs.operation == 'apply'
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=selected-client.tfvars \
            -out="${{ inputs.client }}-apply.tfplan"

      - name: Terraform apply
        if: inputs.operation == 'apply'
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            "${{ inputs.client }}-apply.tfplan"

      - name: Create destroy plan
        if: inputs.operation == 'destroy'
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -var-file=selected-client.tfvars \
            -out="${{ inputs.client }}-destroy.tfplan"

      - name: Terraform destroy
        if: inputs.operation == 'destroy'
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            "${{ inputs.client }}-destroy.tfplan"

      - name: Azure logout
        if: always()
        run: az logout